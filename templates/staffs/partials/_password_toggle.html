{# Show or hide password button. Expects: target_id. Wired by staffs.js. #}
<button type="button" data-target="{{ target_id }}" class="toggle-password icon-btn absolute right-1 top-1/2 -translate-y-1/2" aria-label="Show password" aria-pressed="false">
  <span data-icon="eye-open">{% include "components/_icon.html" with name="eye" size=20 %}</span>
  <span data-icon="eye-closed" class="hidden">{% include "components/_icon.html" with name="eye-slash" size=20 %}</span>
</button>
