{% for faq in faqs %}
<div class="faq-item border-b border-gray-100">
  <button type="button" class="faq-trigger w-full flex items-start gap-4 text-left cursor-pointer py-5">
    <span class="flex-1 text-sm font-semibold text-dark-900">{{ faq.question }}</span>
    <svg class="faq-chevron w-4 h-4 text-gray-400 shrink-0 mt-0.5 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/>
    </svg>
  </button>
  <div class="faq-answer grid grid-rows-[0fr] transition-[grid-template-rows] duration-300 ease-in-out">
    <div class="overflow-hidden">
      <p class="text-sm text-gray-500 leading-relaxed pb-5">{{ faq.answer }}</p>
    </div>
  </div>
</div>
{% endfor %}
