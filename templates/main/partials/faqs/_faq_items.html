{# FAQ accordion items. Expects `faqs` (question, answer). Also rendered by the batch endpoint for the modal. Ids use faq.pk, falling back to the loop counter. #}
{% for faq in faqs %}{% with uid=faq.pk|default:forloop.counter %}
<div class="faq-item border-b border-line">
  <h3 class="m-0 text-body">
    <button type="button" id="faq-q-{{ uid }}" class="faq-trigger flex w-full cursor-pointer items-start gap-4 rounded-xl py-4 text-left" aria-expanded="false" aria-controls="faq-a-{{ uid }}">
      <span class="flex-1 text-body font-semibold text-ink">{{ faq.question }}</span>
      {% include "components/_icon.html" with name="chevron-down" size=20 cls="faq-chevron mt-1 text-muted transition-transform duration-300 motion-reduce:transition-none" %}
    </button>
  </h3>
  <div id="faq-a-{{ uid }}" class="faq-answer grid grid-rows-[0fr] transition-[grid-template-rows] duration-300 ease-in-out motion-reduce:transition-none">
    <div class="overflow-hidden">
      <p class="measure pb-4 text-body text-muted">{{ faq.answer }}</p>
    </div>
  </div>
</div>
{% endwith %}{% endfor %}
