{# About story  #}
<section class="px-4 lg:px-6 py-6">
  <div class="max-w-6xl mx-auto flex flex-col gap-6">

    {# ---- Our Story: text left, image right ---- #}
    <div class="bg-white rounded-3xl shadow-card overflow-hidden">
      <div class="flex flex-col md:flex-row items-between">
        <div class="w-full md:w-1/2 p-8 sm:p-12">
            <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-dark-900 leading-tight mb-4">
              Our Story
            </h2>

            <div class="story-text-wrapper">
              <p class="story-text text-sm text-gray-600 text-justify leading-relaxed h-68 overflow-hidden">
                {{ about.story }}
              </p>
            </div>

            <button
                type="button"
                class="story-learn-more hidden mt-8 inline-flex items-center gap-2 text-sm font-semibold text-brand-500 hover:underline underline-offset-4 decoration-brand-500 hover:text-brand-600 hover:decoration-brand-600 cursor-pointer transition">
                View full story
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6" />
                </svg>
            </button>
        </div>

        <div class="w-full md:w-1/2 h-64 md:h-120">

          <img
            src="https://images.unsplash.com/photo-1758270705317-3ef6142d306f?q=80&w=1000&auto=format&fit=crop"
            alt="Accbizz tutors collaborating together"
            class="w-full h-full object-cover"
          />
        </div>

      </div>
    </div>

    {# ---- Our Story: full text modal ---- #}
    <div class="story-modal-overlay fixed inset-0 z-50 hidden items-center justify-center bg-black/50 px-4">
      <div class="story-modal-box bg-white rounded-2xl shadow-xl w-full max-w-lg sm:max-w-xl max-h-[85vh] flex flex-col p-6 sm:p-8 relative">

        <div class="story-modal-header flex-shrink-0 relative">
          <button
              type="button"
              class="story-modal-close absolute top-0 right-0 text-gray-400 hover:text-gray-700 cursor-pointer transition"
              aria-label="Close">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>

          <h3 class="text-xl sm:text-2xl font-extrabold tracking-tight text-dark-900 mb-4 pr-8">
            Our Story
          </h3>
        </div>

        <div class="story-modal-body flex-1 overflow-y-auto">
          <p class="story-modal-text text-sm text-gray-600 text-justify leading-relaxed"></p>
        </div>

      </div>
    </div>

  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.story-text-wrapper').forEach(function (wrapper) {
      var textEl = wrapper.querySelector('.story-text');
      var learnMoreBtn = wrapper.parentElement.querySelector('.story-learn-more');

      if (!textEl || !learnMoreBtn) return;

      // Only show "Learn more" if the text overflows its fixed height
      if (textEl.scrollHeight > textEl.clientHeight) {
        learnMoreBtn.classList.remove('hidden');
      }

      learnMoreBtn.addEventListener('click', function () {
        var overlay = document.querySelector('.story-modal-overlay');
        var modalText = overlay.querySelector('.story-modal-text');
        modalText.textContent = textEl.textContent.trim();

        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        document.body.classList.add('overflow-hidden');
      });
    });

    var overlay = document.querySelector('.story-modal-overlay');
    if (overlay) {
      var closeModal = function () {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        document.body.classList.remove('overflow-hidden');
      };

      overlay.querySelector('.story-modal-close').addEventListener('click', closeModal);

      // Close when clicking outside the modal box
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeModal();
      });

      // Close on Escape key
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !overlay.classList.contains('hidden')) closeModal();
      });
    }
  });
</script>
