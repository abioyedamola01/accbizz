{% for testimonial in testimonials %}
<figure class="tst-card bg-white rounded-2xl shadow-card border border-gray-100 p-6">

  <svg class="w-5 h-5 text-brand-200 mb-3" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M7.17 6C4.87 8.05 3.5 10.66 3.5 13.5c0 2.9 1.9 4.9 4.4 4.9 2.1 0 3.6-1.5 3.6-3.5 0-1.9-1.3-3.3-3.1-3.5-.2 0-.4 0-.5-.1.4-2.1 2.1-4.3 4-5.6L10.4 4C9.3 4.5 8.1 5.1 7.17 6zm10 0c-2.3 2.05-3.67 4.66-3.67 7.5 0 2.9 1.9 4.9 4.4 4.9 2.1 0 3.6-1.5 3.6-3.5 0-1.9-1.3-3.3-3.1-3.5-.2 0-.4 0-.5-.1.4-2.1 2.1-4.3 4-5.6L20.4 4c-1.1.5-2.3 1.1-3.23 2z"/>
  </svg>

  <blockquote class="text-sm sm:text-base text-gray-700 leading-relaxed">
    {{ testimonial.quote|linebreaksbr }}
  </blockquote>

  {% if testimonial.service %}
  <p class="mt-4">
    <span class="inline-block text-xs font-medium text-brand-500 bg-brand-50 rounded-full px-2.5 py-1">{{ testimonial.service.title }}</span>
  </p>
  {% endif %}

  <figcaption class="flex items-center gap-3">
    <span class="w-10 h-10 shrink-0 rounded-full bg-brand-50 text-brand-500 text-sm font-bold flex items-center justify-center" aria-hidden="true">
      {% if testimonial.name %}
        {{ testimonial.name|slice:":1"|upper }}
      {% else %}
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="8" r="3.5"/>
          <path stroke-linecap="round" d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/>
        </svg>
      {% endif %}
    </span>
    <span class="min-w-0">
      <span class="block text-sm font-semibold text-dark-900">{{ testimonial.name|default:"Anonymous" }}</span>
      {% if testimonial.title %}
        <span class="block text-xs text-gray-500">{{ testimonial.title }}</span>
      {% endif %}
    </span>
  </figcaption>

</figure>
{% endfor %}
