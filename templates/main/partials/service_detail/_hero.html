{# Service Detail — Hero #}
<section class="relative overflow-hidden">

  {# Soft decorative glow behind the visual — quiet, not a competing accent #}
  <div class="pointer-events-none absolute -right-24 top-10 w-[520px] h-[520px] rounded-full bg-brand-200/60 blur-3xl"></div>

  <div class="relative max-w-6xl mx-auto px-4 lg:px-6 pt-10 lg:pt-13">

{# ---- Back + Breadcrumb ---- #}
    <div class="flex items-center gap-4 mb-6">

      <button type="button"
        onclick="if (document.referrer) { history.back() } else { window.location.href = '{% url "main_services" %}' }"
        class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-500 border border-gray-100 rounded-full pl-2 pr-3 py-1.5 hover:bg-cream hover:text-brand-500 transition-colors shrink-0 cursor-pointer">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        Back
      </button>

    </div>

    <div class="">

      <div>
        <h1 class="text-dark-900 text-[2.3rem] sm:text-5xl lg:text-[3.2rem] font-extrabold tracking-tight leading-[1.08]">
          {{ service.title }}
        </h1>
        <p class="mt-5 text-base text-gray-600 text-justify leading-relaxed">
          {{ service.blurb }}
        </p>

        <div class="mt-8 flex flex-wrap items-center gap-3">
          <a href="#"
            class="inline-flex items-center h-11 px-6 rounded-xl bg-brand-500 text-white text-sm font-semibold hover:bg-brand-600 transition-colors">
            Get Started
          </a>
          <a href="{% url "main_services" %}"
            class="inline-flex items-center h-11 px-6 rounded-xl border border-gray-200 text-dark-900 text-sm font-semibold hover:bg-cream transition-colors">
            View Other Services
          </a>
        </div>

      </div>

     

    </div>

  </div>
</section>
