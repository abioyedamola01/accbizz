{# Service Detail — Package / What's Included #}
<section class="px-4 lg:px-6 py-6">
  <div class="max-w-6xl mx-auto">

    <div class="max-w-2xl mb-10">
      <span class="text-xs font-semibold uppercase tracking-wide text-brand-500 mb-2 block">
        What's Included
      </span>
      <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-dark-900 leading-tight">
        Everything you need to get it done
      </h2>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for package in packages %}
        <div class="bg-white rounded-2xl shadow-card border border-gray-100 p-6">
          <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-brand-50 mb-4">
            <svg class="w-5 h-5 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <h3 class="text-sm font-semibold text-dark-900">{{ package.title }}</h3>
          <p class="mt-2 text-sm text-gray-500 leading-relaxed">{{ package.blurb }}</p>
        </div>
      {% endfor %}
    </div>

  </div>
</section>
