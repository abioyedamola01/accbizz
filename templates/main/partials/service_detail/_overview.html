{# Service Detail — Overview #}
<section class="mt-8 px-4 lg:px-6 py-6">
  <div class="max-w-6xl mx-auto">

    <div class="bg-white rounded-3xl shadow-card overflow-hidden">
      <div class="flex flex-col md:flex-row items-stretch">

        <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
          <span class="text-xs font-semibold uppercase tracking-wide text-brand-500 mb-2 block">
            Overview
          </span>

          <div class="overview-text-wrapper">
            <p class="overview-text text-sm text-gray-600 text-justify leading-relaxed h-40 overflow-hidden">
              {{ service.description }}
            </p>
          </div>

          <button
              type="button"
              class="overview-learn-more hidden mt-8 inline-flex items-center gap-2 text-sm font-semibold text-brand-500 hover:underline underline-offset-4 decoration-brand-500 hover:text-brand-600 hover:decoration-brand-600 cursor-pointer transition">
              Read full overview
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6" />
              </svg>
          </button>
        </div>

        <div class="w-full md:w-1/2 h-64 md:h-90">
          <img
            src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1000&auto=format&fit=crop"
            alt="Student working on a project with a tutor"
            class="w-full h-full object-cover"
          />
        </div>

      </div>
    </div>

    {# ---- Overview: full text modal ---- #}
    <div class="overview-modal-overlay fixed inset-0 z-50 hidden items-center justify-center bg-black/50 px-4">
      <div class="overview-modal-box bg-white rounded-2xl shadow-xl w-full max-w-lg sm:max-w-xl max-h-[85vh] flex flex-col p-6 sm:p-8 relative">

        <div class="overview-modal-header flex-shrink-0 relative">
          <button
              type="button"
              class="overview-modal-close absolute top-0 right-0 text-gray-400 hover:text-gray-700 cursor-pointer transition"
              aria-label="Close">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>

          <h3 class="text-xl sm:text-2xl font-extrabold tracking-tight text-dark-900 mb-4 pr-8">
            {{ service.title }}
          </h3>
        </div>

        <div class="overview-modal-body flex-1 overflow-y-auto">
          <p class="overview-modal-text text-sm text-gray-600 text-justify leading-relaxed"></p>
        </div>

      </div>
    </div>

  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.overview-text-wrapper').forEach(function (wrapper) {
      var textEl = wrapper.querySelector('.overview-text');
      var learnMoreBtn = wrapper.parentElement.querySelector('.overview-learn-more');

      if (!textEl || !learnMoreBtn) return;

      // Only show "Read full overview" if the text overflows its fixed height
      if (textEl.scrollHeight > textEl.clientHeight) {
        learnMoreBtn.classList.remove('hidden');
      }

      learnMoreBtn.addEventListener('click', function () {
        var overlay = document.querySelector('.overview-modal-overlay');
        var modalText = overlay.querySelector('.overview-modal-text');
        modalText.textContent = textEl.textContent.trim();

        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        document.body.classList.add('overflow-hidden');
      });
    });

    var overlay = document.querySelector('.overview-modal-overlay');
    if (overlay) {
      var closeModal = function () {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        document.body.classList.remove('overflow-hidden');
      };

      overlay.querySelector('.overview-modal-close').addEventListener('click', closeModal);

      // Close when clicking outside the modal box
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeModal();
      });

      // Close on Escape key
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !overlay.classList.contains('hidden')) closeModal();
      });
    }
  });
</script>
