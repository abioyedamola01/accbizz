{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %} {{ site_info.display_name|title|default:"Accbizz" }} {% endblock title %}</title>
  {% if site_info.favicon %}<link rel="icon" href="{{ site_info.favicon.url }}" />{% endif %}

  <!-- Tailwind compiled CSS -->
  <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  <!-- Global design tokens -->
  <link rel="stylesheet" href="{% static 'css/base.css' %}" />

  {% block extra_css %}{% endblock extra_css %}
</head>
<body class="h-full min-h-screen antialiased bg-gradient-to-br from-brand-100 via-cream to-brand-200 text-dark-900">
  {% block content %}{% endblock content %}

  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
  {% block extra_js %}{% endblock extra_js %}
</body>
</html>
