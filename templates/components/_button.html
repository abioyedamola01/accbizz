{# Params: label, href (renders <a>; omit for <button>), variant (primary|secondary|ghost|link), size (sm|md|lg), icon (icon name, trailing), type, class, attrs (trusted markup only), busy_label (text shown while busy, e.g. "Sending"). Submit buttons always get a spinner. With busy_label, a link or non-submit button also disables itself on click and shows the spinner (see staffs.js and the ui.js snippet). #}
{% if href %}<a href="{{ href }}" class="btn btn-{{ variant|default:'primary' }} btn-{{ size|default:'md' }} {{ class }}" {% if busy_label %}data-busy-label="{{ busy_label }}" data-busy-click{% endif %} {{ attrs|safe }}>{% else %}<button type="{{ type|default:'button' }}" class="btn btn-{{ variant|default:'primary' }} btn-{{ size|default:'md' }} {{ class }}" {% if busy_label %}data-busy-label="{{ busy_label }}"{% if type != 'submit' %} data-busy-click{% endif %}{% endif %} {{ attrs|safe }}>{% endif %}
  {% if busy_label or type == 'submit' %}<svg data-btn-spinner class="hidden animate-spin motion-reduce:animate-none shrink-0" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>{% endif %}
  <span data-btn-label>{{ label }}</span>{% if icon %}{% include "components/_icon.html" with name=icon size=16 cls="nudge-icon" %}{% endif %}
{% if href %}</a>{% else %}</button>{% endif %}
