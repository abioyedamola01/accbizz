{% for faq in faqs %}
<tbody class="faq-group divide-y divide-line border-b border-line">
  <tr>
    <td class="py-3 pr-4"><span class="text-small font-semibold text-ink">{{ faq.question }}</span></td>
    <td class="py-3 pr-4"><span class="text-small text-muted">{{ faq.service.title|default:"General" }}</span></td>
    <td class="py-3 pr-4">
      <button type="button" onclick="toggleManageRow(this)" aria-label="Manage FAQ: {{ faq.question|truncatechars:60 }}"
        class="btn btn-link btn-sm"
        data-update-url="{% url "dashboard_update_faq" faq.slug %}"
        data-delete-url="{% url "dashboard_delete_faq" faq.slug %}"
        data-question="{{ faq.question }}"
        data-answer="{{ faq.answer }}"
        data-service="{{ faq.service_id|default_if_none:'' }}">Manage</button>
    </td>
  </tr>
  {# Manage panel is built by JS from #faqFormTemplate when "Manage" is clicked #}
  <tr class="faq-manage-row hidden"><td colspan="3" class="p-0"></td></tr>
</tbody>
{% endfor %}
